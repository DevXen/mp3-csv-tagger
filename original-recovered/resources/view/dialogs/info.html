<html>

    <head>
        <title></title>

        <style>
            .content {
                width:100%%;
                height:70%;
                padding:10dip;

                border-style:solid;
                border-width:1px;
                border-color:#bfd7fc;
                border-radius:2px;
                box-shadow: 5px 5px 5px #ddd;

            }

            .footer {
                size: *;
                text-align: center;
            }

            .footer button {

                margin:5dip;
                height:35dip;

                border-style:solid;
                border-width:1px;
                border-color:#bfd7fc;
                border-radius:2px;
                box-shadow: 5px 5px 5px #ddd;

                width: 100dip;
            }

        </style>

    </head>

    <body>

        <div id="content" class="content">
        </div>

        <div class="footer">
            <button id="ok">Ok</button>
        </div>

        <script type="text/tiscript">


            self.ready = function () {

                var content_element = $(#content);

                var content = view.parameters.content;
                if (content === undefined || content === null || content.length === 0) content =" ";

                view.windowCaption = view.parameters.title;
                content_element.html = content;

                $(#ok).on("click", function () {
                    view.close();
                });

            }

        </script>

    </body>

</html>
