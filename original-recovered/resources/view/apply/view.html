<div class="apply" id="{{view_id}}">

    <div class="apply-toolbar">
         <button id="run-apply">Apply</button>
         <div class="logback-folder-container">
            <div class="apply_logback_folder-label">Log/Backup Folder</div>
            <input class="apply-logback-folder" readonly></input>
         </div>
         <button id="choose-logback-folder">Browse</button>
    </div>

    <div class="apply-output-container">
        <htmlarea class="apply-output">
        </htmlarea>
    </div>
</div>

{{view_script}}
