<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>

    <style type="text/css" src="component/navigationbar/navigationbar.css"></style>
    <style type="text/css" src="component/fixed-column-table/fixed-column-table.css"></style>
    <style type="text/css" src="component/button/normal-button.css"></style>
    <style type="text/css" src="component/vlist/vlist.css"></style>

    <style type="text/css" src="stylesheets/tabs.css"></style>
    <style type="text/css" src="stylesheets/navigationbar.css"></style>
    <style type="text/css" src="stylesheets/csv.css"></style>
    <style type="text/css" src="stylesheets/preview.css"></style>
    <style type="text/css" src="stylesheets/gui.css"></style>
    <style type="text/css" src="stylesheets/files.css"></style>
    <style type="text/css" src="stylesheets/configuration.css"></style>
    <style type="text/css" src="stylesheets/apply.css"></style>
    <style type="text/css" src="stylesheets/about.css"></style>

    <script type="text/tiscript" src="scripts/observable.tis"></script>

    <popup role="tooltip" id="tooltip"></popup>

</head>
<body>

    <include src="view://navigation/navigation"></include>

    <div #main id="{{view_id}}" class="main">
       <div id="files-container" class="main-container">
            <include src="view://files/files"></include>
       </div>
       <div id="csv-container" class="main-container current-container">
            <include src="view://csv/csv"></include>
       </div>
       <div id="preview-container" class="main-container">
            <include src="view://preview/preview"></include>
       </div>
       <div id="configuration-container" class="main-container">
            <include src="view://configuration/configuration"></include>
       </div>
       <div id="apply-container" class="main-container">
             <include src="view://apply/apply"></include>
       </div>
       <div id="about-container" class="main-container">
             <include src="view://about/about"></include>
       </div>
    </div>

    <div class="status-bar">
    </div>

    {{view_script}}

    <include src="view://progress-dialog/progress"></include>

    <include src="view://color-chooser/color_chooser"></include>

    <include src="view://project/project"></include>

    <include src="view://dialogs/dialogs"></include>

</body>
</html>
