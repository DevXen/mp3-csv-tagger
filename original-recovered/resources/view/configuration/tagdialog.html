<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tag</title>

    <style>
        .content {
            height:50%;
            border-style:solid;
            border-width:1px;
            border-color:#bfd7fc;
            border-radius:2px;
            padding:15px;
            margin:15px;
            display:block;
        }

        .input-required {
            border-color: #ff0000;
        }

        .content > label {
            display: block;
        }

        .tag-name-input {
            height: 20dip;
            width : 95%%;
        }

        .alt-tag-name-input {
            height: 20dip;
            width : 95%%;
        }

        .footer {
            height:*;
            text-align: center;
            width: 100%%;
        }

        .footer button {

            margin:5dip;
            height:35dip;

            border-style:solid;
            border-width:1px;
            border-color:#bfd7fc;
            border-radius:2px;
            box-shadow: 5px 5px 5px #ddd;

            width: 80dip;
        }

        .input-warning {
            display: none;
            padding:5px;
            color: #ff0000;
        }

    </style>
</head>
<body>

    <div class="content">
        <label for=tag_name>Tag Name</label>
        <input #tag_name class="tag-name-input" name="tag_name"></input>
        <br/>
        <br/>
        <label for=alt_tag_name>Alternative Tag Name</label>
        <input #alt_tag_name class="alt-tag-name-input" name="alt_tag_name"></input>
        <div class="input-warning">Fields are required</div>
    </div>

    <div class="footer">
        <button #ok_button>Ok</button>
        <button #cancel_button>Cancel</button>
    </div>

    <script type="text/tiscript">

        var tag_name = $(#tag_name);
        var alt_tag_name = $(#alt_tag_name);

        self.ready = function () {
            var tag_name_value = view.parameters.tag_name;
            var alt_tag_name_value = view.parameters.alt_tag_name;

            if (tag_name_value != undefined && tag_name_value != null) {
                tag_name.value = tag_name_value;
            }

            if (alt_tag_name_value != undefined && alt_tag_name_value != null) {
                alt_tag_name.value = alt_tag_name_value;
            }


            $(#ok_button).on("click", function () {

                var tag_name_value = tag_name.value
                var alt_tag_name_value = alt_tag_name.value

                var valid = true;
                if (tag_name_value == undefined || tag_name_value == null || tag_name_value.length == 0) {
                    tag_name.attributes.addClass("input-required");
                    valid = false;
                }
                if (alt_tag_name_value == undefined || alt_tag_name_value == null || alt_tag_name_value.length == 0) {
                    alt_tag_name.attributes.addClass("input-required");
                    valid = false;
                }

                if (!valid) {
                    $(.input-warning).style.set({"display":"block"});
                    return;
                }

                view.close();
                view.parameters.ok_callback (tag_name.value, alt_tag_name.value);

            });

            $(#cancel_button).on("click", function () {
                view.close();
            });

        };
    </script>

</body>
</html>
