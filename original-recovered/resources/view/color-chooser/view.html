<style>
      popup > widget[type=hsv] {
        padding:1em; background: #d3e4ff;
        border-style:solid;
        border-width:1px;
        border-color:#a7c4f2;
      }

      widget[type=hsv] {
        var(hue): #ff0000;
        prototype: HSVSelector;
        display:block;
        size:max-content;
      }

      widget[type=hsv] > input.hue
      {
        display:block;
        border:none;
        height: 3dip;
        width:182dip;
        margin:0 *;
        background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
      }

      widget[type=hsv] > div.layers {
        size:180dip;
        flow:stack;
        margin:*;
      }

      widget[type=hsv] > div.layers > div.value {
        size:*;
        background: linear-gradient(to bottom, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 1%, rgba(0,0,0,1.0) 100%);
      }
      widget[type=hsv] > div.layers > div.saturation {
        size:*;
        background: linear-gradient(to right, color(hue) 0%, #ffffff 100%);
      }

      widget[type=hsv] > div.layers > div.pointer {
        border:2dip solid #fff;
        size:7dip;
        transform: translate(-50%,-50%);
        border-radius:50%;
      }

      #color-chooser-selection {
        padding:0px;
        margin:0px;
        height:25px;
      }

      #color-chooser-toolbar {
         flow: horizontal;
         padding:2px;
      }

      #color-chooser-set {
         margin-left:40%;
         margin-right:40%;
      }


</style>

    <popup #color-chooser-popup>
      <widget|hsv #color-chooser>
        <div.layers>
          <div.saturation/>
          <div.value/>
          <div.pointer/>
        </div>
        <input|hslider.hue min=0 max=360 />
      </widget>
      <div#color-chooser-selection></div>
      <div#color-chooser-toolbar>
            <button #color-chooser-set>Set</button>
      </div>
    </popup>

{{view_script}}
