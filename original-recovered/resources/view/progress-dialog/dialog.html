<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generating Preview</title>

    <style>
        body {
            padding: 20px;
            margin: 0px;
        }

        .icon-column {
            width: 60px;
            height: 60px;
        }

        .icon-column > img {
            width: 40px;
            height: 40px;
        }

        .status-column {
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="icon-column">
                <img src="/icons/40/icons8-available-updates-40.png"/>
            </td>
            <td class="status-column" id="status-column">
                Please wait...
            </td>
        </tr>
    </table>

    <script type="text/tiscript">

        var progress_error_occurred = false;

        self.ready = function () {

            var progress = view.parameters.parent_view.views().progress;

            view.parameters.dialog_events.listenForStatusUpdates (function (status) {
                update_status(status);
                view.doEvent();
            });

            view.parameters.dialog_events.listenForErrorUpdates (function (error) {
                update_status(error);
                progress_error_occurred = true;
                view.doEvent();
            });

            var p = promise();
            $(body).timer(1s, function () {
                p(true, []);
                return false;
            });

            p.then(function () {
                try {
                    view.parameters.dialog_ready_callback();
                }
                catch (e) {
                    view.parameters.parent_view.views().dialogs.show_info_dialog("Error",e);
                }
            });

            view.parameters.dialog_events.listenForCloseDialog (function () {
                close_dialog();
            });

        }

        function close_dialog() {
            if (!progress_error_occurred) {
                view.close();
            }
        }

        function update_status(content) {
            $(#status-column).html = content;
        }

        function update_status_error(msg, error) {
            $(#status-column).html = msg+". "+error;
        }

    </script>
</body>
</html>
