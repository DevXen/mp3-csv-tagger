<div excluded-class="csv-entry-excluded" class="csv-entry {% if not entry.included %}csv-entry-excluded{% endif %}" id="entry_{{entry.id}}">

    <div class="csv-entry-header">

        <table>
            <tr>
                <td class="csv-entry-header-icon"><img class="csv-entry-header-icon" src="icons/40/icons8-export-csv-40.png"></img></td>
                <td class="csv-entry-header-titles">
                    <div class="csv-entry-header-title">
                        {{csv_file}}
                    </div>
                    <div class="csv-entry-header-sub-title">
                        {{csv_path}}
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <table>
        <thead>
            <tr>
                {% for tag in tags %}
                <th>
                    {{tag.name}}
                </th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            <tr>
                {% for tag in tags %}
                <td>
                    <select id="tag_{{tag.id}}" data-id="{{tag.id}}">
                        {% for name, values in options.items() %}
                            <option name="tag-option-{{name}}" value="{{values.value}}" {% if tag.role == values.value %}selected{% endif %} style="background-color:{{values.color}}">{{values.caption}}</option>
                        {% endfor %}
                    </select>
                </td>
                {% endfor %}
            </tr>
        </tbody>
    </table>

    <div class="csv-entry-toolbar">
        <button|checkbox {% if entry.included %}checked{% endif %} data-id="{{entry.id}}" id="entry_include_{{entry.id}}" class="csv-entry-toolbar-checkbox"/>
        <normal-button hint="Delete entry from list" data-id="{{entry.id}}" id="entry_delete_{{entry.id}}" class="csv-entry-toolbar-button remove-csv-entry" image="icons/40/icons8-delete-40.png"/>
        <normal-button hint="Move entry up list" data-id="{{entry.id}}" id="entry_moveup_{{entry.id}}" class="csv-entry-toolbar-button move-up-csv-entry" image="icons/40/icons8-up-40.png"/>
        <normal-button hint="Move entry down list" data-id="{{entry.id}}" id="entry_movedown_{{entry.id}}" class="csv-entry-toolbar-button move-down-csv-entry" image="icons/40/icons8-down-arrow-40.png"/>
        <normal-button hint="Update/Refresh Tags" data-id="{{entry.id}}" id="entry_update_{{entry.id}}" class="csv-entry-toolbar-button update-csv-entry" image="icons/40/icons8-new-file-40.png"/>
    </div>

</div>
